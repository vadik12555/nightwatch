# Nginx in front of Gunicorn: serves static files itself, proxies the rest,
# and adds a coarse per-IP limit on the ingest endpoint (Django also limits per token).
# For HTTPS put a TLS terminator in front, or add `listen 443 ssl` with certificates here.

limit_req_zone $binary_remote_addr zone=ingest:10m rate=20r/s;

upstream nightwatch_web {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;  # agent reports are small; reject anything huge early
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        alias /static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /api/v1/ingest/ {
        limit_req zone=ingest burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://nightwatch_web;
        proxy_set_header Host $http_host;  # keeps the port: Django CSRF compares it with Origin
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://nightwatch_web;
        proxy_set_header Host $http_host;  # keeps the port: Django CSRF compares it with Origin
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
