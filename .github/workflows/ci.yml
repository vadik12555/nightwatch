name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff~=0.17.6"
      - run: ruff check .
      - run: ruff format --check .
      - run: shellcheck agent/install.sh backend/entrypoint.sh

  test:
    name: Tests (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nightwatch
          POSTGRES_PASSWORD: nightwatch
          POSTGRES_DB: nightwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nightwatch:nightwatch@localhost:5432/nightwatch
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            agent/requirements.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Migrations are up to date
        run: python backend/manage.py makemigrations --check --dry-run
      - run: python -m pytest -v

  docker:
    name: Docker Compose smoke test + agent install
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=$(openssl rand -hex 32)/" .env

      - name: docker compose up (waits for every healthcheck)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Stack answers through Nginx
        run: |
          docker compose ps
          curl -fsS http://localhost/healthz/
          curl -fsS -o /dev/null -w "login page: %{http_code}\n" http://localhost/accounts/login/
          curl -fsS -o /dev/null -w "static css: %{http_code}\n" http://localhost/static/css/app.css
          docker compose exec -T web python manage.py migrate --check
          docker compose exec -T web python manage.py shell -c \
            "from servers.models import Server; print('demo servers:', Server.objects.filter(is_demo=True).count())"

      - name: Create a server and install the agent like a user would
        run: |
          TOKEN=$(docker compose exec -T web python manage.py shell -c \
            "from servers.models import Server; print(Server.create_with_token(name='ci-runner')[1])" | tail -n1)
          curl -fsSL http://localhost/agent/install.sh \
            | sudo bash -s -- --url http://localhost --token "$TOKEN" --interval 5
          systemctl --no-pager status nightwatch-agent

      - name: Agent reports arrive in the database
        run: |
          for i in $(seq 1 30); do
            COUNT=$(docker compose exec -T web python manage.py shell -c \
              "from servers.models import Server; print(Server.objects.get(name='ci-runner').snapshots.count())" | tail -n1)
            echo "snapshots from ci-runner: $COUNT"
            if [ "$COUNT" -ge 3 ]; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Diagnostics
        if: failure()
        run: |
          docker compose logs --tail=200
          sudo journalctl -u nightwatch-agent --no-pager -n 100 || true

      - name: Tear down
        if: always()
        run: docker compose down -v
